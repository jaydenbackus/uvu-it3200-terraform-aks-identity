apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-it3200
  namespace: it3200-lab
  labels:
    app: hello-it3200
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-it3200
  template:
    metadata:
      labels:
        app: hello-it3200
    spec:
      containers:
        - name: web
          # Replace with your registry: terraform output -raw acr_login_server
          image: ACR_LOGIN_SERVER/hello-it3200:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
